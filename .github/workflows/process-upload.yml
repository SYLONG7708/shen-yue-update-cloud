name: Process ShenYue cloud upload

on:
  repository_dispatch:
    types: [shen-yue-cloud-upload]
  workflow_dispatch:
    inputs:
      job_id:
        description: Existing Netlify job ID
        required: true
        type: string

concurrency:
  group: shen-yue-cloud-uploader
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOB_ID: ${{ github.event.client_payload.jobId || inputs.job_id }}
      UPLOAD_BASE_URL: https://shen-yue-update-cloud.netlify.app
      SHENYUE_UPLOAD_KEY: ${{ secrets.SHENYUE_UPLOAD_KEY }}
      GITHUB_TOKEN: ${{ secrets.CLOUD_SYNC_TOKEN }}
      APPS_SCRIPT_ENDPOINT: ${{ secrets.APPS_SCRIPT_ENDPOINT }}
      GITHUB_OWNER: SYLONG7708
      GITHUB_UPDATE_REPO: update
      GITHUB_ASSISTANT_REPO: shen-yue-iphone-assistant
      GITHUB_RELEASE_TAG: apk-cloud
    steps:
      - name: Checkout permanent uploader
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Process APK and synchronize manifests
        run: node tools/cloud-worker.mjs
